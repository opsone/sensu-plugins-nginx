server {
    listen 80;

    location = /nginx-status {
        stub_status;
    }
    location = /redirect {
        return 301 /nginx-status;
    }
    location = /html {
        default_type text/html;
        return 200 '<html><body>Welcome to nginx!</body></html>';
    }
    location / {
        return 404;
    }
}
